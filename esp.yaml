substitutions:
  name: sila-k-6200moht
  friendly_name: "SILA K 6200MOHT"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp8266:
  board: esp01_1m

logger:
  baud_rate: 0
  level: DEBUG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Fallback"

api:
ota:
  - platform: esphome

external_components:
  - source: github://syssi/esphome-pipsolar@main
    refresh: 0s

uart:
  id: uart_sila
  tx_pin: GPIO1
  rx_pin: GPIO3
  baud_rate: 2400
  debug:
    direction: BOTH
    dummy_receiver: false
    after:
      delimiter: "\r"
    sequence:
      - lambda: UARTDebug::log_string(direction, bytes);

pip8048:
  id: inverter
  uart_id: uart_sila

################################################################
# НОВЫЙ БЛОК SELECT (выпадающие списки для управления)
################################################################
select:
  - platform: pip8048
    pipsolar_id: inverter
    
    # Выбор режима работы инвертора
    output_source_priority:
      name: "${friendly_name} Output source priority"
      optionsmap:
        "Utility first": "POP00"
        "Solar first": "POP01"
        "SBU first": "POP02"
      statusmap:
        "0": "Utility first"
        "1": "Solar first"
        "2": "SBU first"
    
    # Выбор приоритета зарядки
    charger_source_priority:
      name: "${friendly_name} Charger source priority"
      optionsmap:
        "Solar first": "PCP01"
        "Solar and utility": "PCP02"
        "Solar charging only": "PCP03"
      statusmap:
        "1": "Solar first"
        "2": "Solar and utility"
        "3": "Solar charging only"
    
    # Максимальный ток заряда от сети
    current_max_ac_charging_current:
      name: "${friendly_name} Max AC charging current"
      optionsmap:
        "2A": "MUCHGC0002"
        "10A": "MUCHGC0010"
        "20A": "MUCHGC0020"
        "30A": "MUCHGC0030"
        "40A": "MUCHGC0040"
        "50A": "MUCHGC0050"
        "60A": "MUCHGC0060"
        "70A": "MUCHGC0070"
        "80A": "MUCHGC0080"
        "90A": "MUCHGC0090"
        "100A": "MUCHGC0100"
        "110A": "MUCHGC0110"
        "120A": "MUCHGC0120"
      statusmap:
        "2": "2A"
        "10": "10A"
        "20": "20A"
        "30": "30A"
        "40": "40A"
        "50": "50A"
        "60": "60A"
        "70": "70A"
        "80": "80A"
        "90": "90A"
        "100": "100A"
        "110": "110A"
        "120": "120A"
    
    # Общий максимальный ток заряда
    current_max_charging_current:
      name: "${friendly_name} Max charging current"
      optionsmap:
        "10A": "MCHGC010"
        "20A": "MCHGC020"
        "30A": "MCHGC030"
        "40A": "MCHGC040"
        "50A": "MCHGC050"
        "60A": "MCHGC060"
        "70A": "MCHGC070"
        "80A": "MCHGC080"
        "90A": "MCHGC090"
        "100A": "MCHGC100"
        "110A": "MCHGC110"
        "120A": "MCHGC120"
      statusmap:
        "10": "10A"
        "20": "20A"
        "30": "30A"
        "40": "40A"
        "50": "50A"
        "60": "60A"
        "70": "70A"
        "80": "80A"
        "90": "90A"
        "100": "100A"
        "110": "110A"
        "120": "120A"

################################################################
# НОВЫЙ БЛОК OUTPUT (числовые параметры, которые можно менять)
################################################################
output:
  - platform: pip8048
    pipsolar_id: inverter
    battery_recharge_voltage:
      id: inverter_battery_recharge_voltage_out
      name: "${friendly_name} Battery recharge voltage"
      
  - platform: pip8048
    pipsolar_id: inverter
    battery_bulk_voltage:
      id: inverter_battery_bulk_voltage_out
      name: "${friendly_name} Battery bulk voltage"

################################################################
# ПЕРЕКЛЮЧАТЕЛИ (управление режимами)
################################################################
switch:
  - platform: pip8048
    pipsolar_id: inverter
    output_source_priority_utility:
      name: "${friendly_name} Mode UTI (Utility priority)"
    output_source_priority_solar:
      name: "${friendly_name} Mode SUB (Solar priority)"
    output_source_priority_battery:
      name: "${friendly_name} Mode SBU (Battery priority)"
    input_voltage_range:
      name: "${friendly_name} Input voltage range"
    overload_bypass:
      name: "${friendly_name} Overload bypass"
    power_saving:
      name: "${friendly_name} Power saving"

################################################################
# ДАТЧИКИ (сенсоры)
################################################################
sensor:
  - platform: pip8048
    pipsolar_id: inverter

    # QPIGS - основные данные
    grid_voltage:
      name: "${friendly_name} Grid voltage"
    grid_frequency:
      name: "${friendly_name} Grid frequency"
    ac_output_voltage:
      name: "${friendly_name} AC output voltage"
    ac_output_frequency:
      name: "${friendly_name} AC output frequency"
    ac_output_apparent_power:
      name: "${friendly_name} AC apparent power"
    ac_output_active_power:
      name: "${friendly_name} AC active power"
    output_load_percent:
      name: "${friendly_name} Load"
    bus_voltage:
      name: "${friendly_name} Bus voltage"
    battery_voltage:
      name: "${friendly_name} Battery voltage"
    battery_charging_current:
      name: "${friendly_name} Battery charging current"
    battery_capacity_percent:
      name: "${friendly_name} Battery SOC"
    inverter_heat_sink_temperature:
      name: "${friendly_name} Inverter temperature"
    pv1_input_current:
      name: "${friendly_name} PV1 current"
    pv1_input_voltage:
      name: "${friendly_name} PV1 voltage"
    battery_voltage_scc:
      name: "${friendly_name} Battery voltage SCC"
    battery_discharge_current:
      name: "${friendly_name} Battery discharge current"
    pv1_charging_power:
      name: "${friendly_name} PV1 power"

    # QPIGS2 - второй MPPT (если есть)
    pv2_input_current:
      name: "${friendly_name} PV2 current"
    pv2_input_voltage:
      name: "${friendly_name} PV2 voltage"
    pv2_charging_power:
      name: "${friendly_name} PV2 power"

################################################################
# ТЕКСТОВЫЕ СЕНСОРЫ
################################################################
text_sensor:
  - platform: pip8048
    pipsolar_id: inverter
    device_mode:
      name: "${friendly_name} Operating mode"
      filters:
        map:
          - P -> Power on mode
          - S -> Standby mode
          - L -> Line mode
          - B -> Battery mode
          - F -> Fault mode
          - D -> Shutdown mode

################################################################
# БИНАРНЫЕ СЕНСОРЫ
################################################################
binary_sensor:
  - platform: pip8048
    pipsolar_id: inverter
    load_status:
      name: "${friendly_name} Load status"
    charging_status:
      name: "${friendly_name} Charging"
    scc_charging_status:
      name: "${friendly_name} PV charging"
    ac_charging_status:
      name: "${friendly_name} AC charging"
    configuration_status:
      name: "${friendly_name} Configuration status"
