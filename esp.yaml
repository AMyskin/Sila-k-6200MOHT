substitutions:
  name: sila-k-6200moht
  friendly_name: "SILA K 6200MOHT"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp8266:
  board: esp01_1m

logger:
  baud_rate: 0
  level: DEBUG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "${friendly_name} Fallback"

api:

ota:
  - platform: esphome

external_components:
  - source: github://syssi/esphome-pipsolar@main
    refresh: 0s

uart:
  id: uart_sila
  tx_pin: GPIO1
  rx_pin: GPIO3
  baud_rate: 2400
  # data_bits: 8
  # parity: NONE
  # stop_bits: 1

  debug:
    direction: BOTH
    dummy_receiver: false
    after:
      delimiter: "\r"
    sequence:
      - lambda: UARTDebug::log_string(direction, bytes);

pip8048:
  id: inverter
  uart_id: uart_sila

switch:
  - platform: pip8048
    pipsolar_id: inverter
    
    # Управление приоритетом источника питания (режимы инвертора)
    # Каждый переключатель включает свой режим, отключая другие.
    output_source_priority_battery:
      name: "${friendly_name} Mode SBU (Battery priority)"
    output_source_priority_solar:
      name: "${friendly_name} Mode SUB (Solar priority)"
    output_source_priority_utility:
      name: "${friendly_name} Mode UTI (Utility priority)"
    # Опционально: гибридный режим (работает нестабильно на некоторых прошивках)
    # output_source_priority_hybrid:
    #   name: "${friendly_name} Mode Hybrid (Solar+Battery)"
    
    # Разрешение заряда от сети
    # ac_charging_enabled:
    #  name: "${friendly_name} AC charging enabled"
    
    # Разрешение заряда от солнечных панелей
    # scc_charging_enabled:
    #  name: "${friendly_name} PV charging enabled"

    # ВНИМАНИЕ: Переключатель приоритета зарядки пока недоступен в компоненте pip8048 [citation:4].
    # charger_source_priority:
    #   name: "${friendly_name} Charger source priority"

sensor:

  - platform: pip8048
    pipsolar_id: inverter

    ac_output_apparent_power:
      name: "${friendly_name} AC apparent power"

    ac_output_active_power:
      name: "${friendly_name} AC active power"

    output_load_percent:
      name: "${friendly_name} Load"

    battery_voltage:
      name: "${friendly_name} Battery voltage"

    battery_charging_current:
      name: "${friendly_name} Battery charging current"

    battery_capacity_percent:
      name: "${friendly_name} Battery SOC"

    inverter_heat_sink_temperature:
      name: "${friendly_name} Inverter temperature"

    pv1_input_current:
      name: "${friendly_name} PV current"

    pv1_input_voltage:
      name: "${friendly_name} PV voltage"

    pv1_charging_power:
      name: "${friendly_name} PV power"

    battery_discharge_current:
      name: "${friendly_name} Battery discharge current"

########## ИСПРАВЛЕНО: ЗАМЕНЕННЫЕ ДАТЧИКИ ##########
    # Вместо ac_input_voltage используем grid_voltage
    grid_voltage:
      name: "${friendly_name} Grid voltage"
    
    # Вместо ac_charging_current используем один из доступных датчиков тока
    # Например, общий ток заряда батареи уже есть выше
    # Если нужен ток заряда от сети - он недоступен, но можно использовать grid_frequency
    grid_frequency:
      name: "${friendly_name} Grid frequency"

    # Вместо battery_charging_power используем pv1_charging_power (уже есть выше)
    # Или добавляем pv2_charging_power если у вас второй MPPT
    pv2_charging_power:
      name: "${friendly_name} PV2 power"

    # Вместо battery_discharge_power используем pv2_charging_power или оставляем battery_discharge_current
    # Можно также добавить другие полезные датчики
    ac_output_voltage:
      name: "${friendly_name} AC output voltage"

    bus_voltage:
      name: "${friendly_name} Bus voltage"

    battery_voltage_scc:
      name: "${friendly_name} Battery voltage SCC"

    ac_output_frequency:
      name: "${friendly_name} AC output frequency"

text_sensor:

  - platform: pip8048
    pipsolar_id: inverter

    device_mode:
      name: "${friendly_name} Operating mode"

    last_qflag:
      name: "${friendly_name} QFLAG raw"

binary_sensor:

  - platform: pip8048
    pipsolar_id: inverter

    load_status:
      name: "${friendly_name} Load status"

    charging_status:
      name: "${friendly_name} Charging"

    scc_charging_status:
      name: "${friendly_name} PV charging"

    ac_charging_status:
      name: "${friendly_name} AC charging"
